# Java-only survival server (everyone on a computer with Java Edition).
# Home players connect to the NAS IP; remote players connect over Tailscale (see bottom).
# Change the three "CHANGE ME" items before starting.

services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    container_name: mc
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"          # accepts https://aka.ms/MinecraftEULA
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "4G"          # 4 GB NAS -> 2G, 8 GB -> 3G-4G, 16 GB+ -> 4G-6G
      TZ: "America/New_York"

      MODE: "survival"
      DIFFICULTY: "normal"
      MOTD: "Cousins Survival"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "8"
      SPAWN_PROTECTION: "0"

      # CHANGE ME (1/3): your Java username (gets admin/commands)
      OPS: |
        YourJavaUsername
      EXISTING_OPS_FILE: "MERGE"

      # CHANGE ME (2/3): everyone allowed to join, one Java username per line
      WHITELIST: |
        YourJavaUsername
        CousinJavaUsername
        GirlfriendJavaUsername
      EXISTING_WHITELIST_FILE: "MERGE"
      ENFORCE_WHITELIST: "TRUE"

      # CHANGE ME (3/3): any long random text, same value in "backups" below
      RCON_PASSWORD: "change-me-to-a-long-random-password"
    volumes:
      - ./data:/data

  backups:
    image: itzg/mc-backup:latest
    container_name: mc-backups
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: "change-me-to-a-long-random-password"
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
      PAUSE_IF_NO_PLAYERS: "true"
      TZ: "America/New_York"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups

  # Private link for players outside the house (no router port forwarding needed).
  # First start: open the "tailscale" container log and click the login link it prints.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_HOSTNAME: "minecraft-nas"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_USERSPACE: "false"
    volumes:
      - ./tailscale:/var/lib/tailscale
