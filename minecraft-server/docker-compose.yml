# Minecraft Java server for a NAS, using the itzg/minecraft-server image.
# Settings live in .env (copy .env.example to .env and edit it first).
# Docs: https://docker-minecraft-server.readthedocs.io/

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "${MC_PORT:-25565}:25565"
      # Uncomment together with the Geyser PLUGINS block below to let
      # Bedrock players (phones, tablets, Windows Bedrock) join.
      # - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: "${SERVER_TYPE:-PAPER}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${MEMORY:-3G}"
      USE_AIKAR_FLAGS: "true"
      TZ: "${TZ:-UTC}"
      # Run as your NAS user so you can open the world files over SMB.
      # The image chowns the data folder to this user on startup.
      UID: "${MC_UID:-1000}"
      GID: "${MC_GID:-1000}"

      MOTD: "${MOTD:-A Minecraft Server}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MODE: "${GAME_MODE:-survival}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      # Lower distances = less CPU. NAS CPUs are usually modest.
      VIEW_DISTANCE: "${VIEW_DISTANCE:-8}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-6}"

      OPS: "${OPS:-}"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-true}"
      WHITELIST: "${WHITELIST:-}"

      # RCON stays inside the Docker network (port 25575 is not published).
      # The backup container uses it to pause saving while it copies files.
      RCON_PASSWORD: "${RCON_PASSWORD:?Set RCON_PASSWORD in .env}"

      # Crossplay for Bedrock players: uncomment, plus the 19132/udp port above.
      # PLUGINS: |
      #   https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
      #   https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: mc-health
      # First boot downloads the server and generates the world, which can be
      # slow on NAS hardware, so allow longer than the image default.
      start_period: 5m
      interval: 30s
      retries: 3

  backups:
    image: itzg/mc-backup:latest
    container_name: minecraft-backups
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD:?Set RCON_PASSWORD in .env}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-6h}"
      PRUNE_BACKUPS_DAYS: "${PRUNE_BACKUPS_DAYS:-14}"
      # Don't stack up identical backups while nobody is playing.
      PAUSE_IF_NO_PLAYERS: "true"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
