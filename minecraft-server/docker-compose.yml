# Survival server with Java + Bedrock crossplay (phones, tablets, Windows, Switch, Xbox, PlayStation).
#   Java players connect on port 25565 (TCP)
#   Bedrock players connect on port 19132 (UDP), handled by the Geyser plugin
# Before starting: change the three "CHANGE ME" items below. Setup steps are in README.md.

services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    container_name: mc
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"       # Java Edition
      - "19132:19132/udp"   # Bedrock Edition
    environment:
      EULA: "TRUE"          # accepts https://aka.ms/MinecraftEULA
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "4G"          # RAM given to Minecraft; see "RAM" in README.md
      TZ: "America/New_York"

      # Geyser lets Bedrock clients join; Floodgate lets them join without owning Java Edition.
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

      MODE: "survival"
      DIFFICULTY: "normal"
      MOTD: "Cousins Survival"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "8"    # lower = less work for the NAS CPU
      SPAWN_PROTECTION: "0" # let everyone build near spawn

      # CHANGE ME (1/3): your Java username. Ops can use every command.
      OPS: |
        YourJavaUsername
      EXISTING_OPS_FILE: "MERGE"         # keep people you /op in-game across restarts

      # CHANGE ME (2/3): only listed players can join. Java usernames go here;
      # Bedrock players are added in-game with /fwhitelist add <gamertag> (see README.md).
      WHITELIST: |
        YourJavaUsername
      EXISTING_WHITELIST_FILE: "MERGE"   # keep people you whitelist in-game across restarts
      ENFORCE_WHITELIST: "TRUE"

      # CHANGE ME (3/3): any long random text. Must match the one in "backups" below.
      RCON_PASSWORD: "change-me-to-a-long-random-password"
    volumes:
      - ./data:/data

  # Saves a copy of the world every 6 hours while someone is online, keeping 7 days of copies.
  backups:
    image: itzg/mc-backup:latest
    container_name: mc-backups
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: "change-me-to-a-long-random-password"
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
      PAUSE_IF_NO_PLAYERS: "true"
      TZ: "America/New_York"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
